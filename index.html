<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Adversary — 7 attackers. 7 defenders. 1 verdict. A multi-agent debate system that interrogates startup pitches." />
    <meta property="og:title" content="Adversary" />
    <meta property="og:description" content="7 attackers. 7 defenders. 1 verdict. Drop your pitch." />
    <meta property="og:type" content="website" />
    <title>Adversary — 7 attackers. 7 defenders. 1 verdict.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Theme bootstrap — runs synchronously before React mounts so there
      // is no flash of the wrong theme on first paint.
      (function () {
        try {
          var stored = localStorage.getItem('adversary-theme');
          var prefersDark = window.matchMedia
            && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
